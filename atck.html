<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>attacker page</title>
    <style>
      html,
      body {
        overflow: hidden;
        touch-action: none;
        height: 100vh;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Roboto",
          -apple-system,
          sans-serif;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        color: #202124;
      }

      .card {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 40px 30px;
        width: 100%;
        max-width: 380px;
        text-align: center;
        margin-top: 50px;
        box-sizing: border-box;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #4285f4;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 24px;
        font-weight: 400;
        margin: 0 0 10px 0;
      }
      p.subtitle {
        font-size: 16px;
        color: #5f6368;
        margin-bottom: 30px;
      }
      input {
        width: 100%;
        padding: 13px 15px;
        margin-bottom: 15px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border: 2px solid #1a73e8;
        padding: 12px 14px;
      }
      button {
        background: #1a73e8;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }
      button:active {
        background: #1557b0;
      }

      #capture-log {
        display: none;
        margin-top: 25px;
        padding: 15px;
        background-color: #fce8e6;
        border: 1px dashed #d93025;
        color: #d93025;
        font-weight: bold;
        border-radius: 6px;
        text-align: left;
        font-size: 14px;
        word-break: break-all;
      }
      .cap-label {
        color: #333;
        font-weight: normal;
      }
      .cap-val {
        color: #1a73e8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>enter your Apple account username and password</h1>
      <p>
        check the validation in your address bar that this is a page from Apple
      </p>

      <input type="text" id="username" placeholder="email" autocomplete="off" />
      <input
        type="password"
        id="password"
        placeholder="enter your password"
        autocomplete="off"
      />

      <button onclick="captureData()">submit</button>

      <div id="capture-log">
        <div
          style="
            margin-bottom: 10px;
            border-bottom: 1px solid #d93025;
            padding-bottom: 5px;
          "
        >
          CAPTURED
        </div>
        <div>
          <span class="cap-label">user:</span>
          <span id="cap-user" class="cap-val"></span>
        </div>
        <div style="margin-top: 5px">
          <span class="cap-label">pass:</span>
          <span id="cap-pass" class="cap-val"></span>
        </div>
      </div>
    </div>

    <script>
      function captureData() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if (!u && !p) {
          alert("pls enter email and password");
          return;
        }

        document.getElementById("cap-user").innerText = u || "[EMPTY]";
        document.getElementById("cap-pass").innerText = p || "[EMPTY]";
        document.getElementById("capture-log").style.display = "block";

        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      }
    </script>
  </body>
</html>
