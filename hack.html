<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>attacker page</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
        padding: 24px 20px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        color: #1c1c1e;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #8e8e93;
        margin-bottom: 32px;
      }
      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 16px;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
        background: #fff;
      }
      input:focus {
        outline: none;
        border-color: #007aff;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        background: #005bb5;
      }
      .captured {
        margin-top: 20px;
        padding: 12px;
        background: #e8f5e9;
        border-radius: 8px;
        font-size: 13px;
        color: #2e7d32;
        display: none;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ATTACKER PAGE</h1>
      <p>ADDRESS BAR SPOOFING</p>
      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="off"
      />
      <input type="password" id="password" placeholder="Password" />
      <button id="submitBtn">Submit</button>
      <div id="capturedDiv" class="captured"></div>
    </div>

    <script>
      document
        .getElementById("submitBtn")
        .addEventListener("click", function () {
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const capturedDiv = document.getElementById("capturedDiv");

          if (username && password) {
            capturedDiv.style.display = "block";
            capturedDiv.innerHTML =
              "CREDENTIALS CAPTURED<br>Username: " +
              username +
              "<br>Password: " +
              password;
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
          } else {
            capturedDiv.style.display = "block";
            capturedDiv.style.background = "#ffebee";
            capturedDiv.style.color = "#c62828";
            capturedDiv.innerHTML = "Please fill in both fields";
            setTimeout(() => {
              capturedDiv.style.display = "none";
            }, 1500);
          }
        });
    </script>
  </body>
</html>
